name: Mobile App CI Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'

jobs:
  flutter-validation:
    name: Flutter Lint, Test & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Kode Sumber
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Verifikasi Versi Lingkungan
        run: |
          flutter --version
          dart --version

      - name: Unduh Dependensi Proyek (pub get)
        run: flutter pub get

      - name: Analisis Statis Kode (Flutter Analyze)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Eksekusi Pengujian Otomatis (Unit & Widget Tests)
        run: flutter test --coverage

      - name: Uji Kompilasi Android APK (Build Check)
        run: flutter build apk --debug